name: Comment PR

on:
  workflow_run:
    workflows: ["Build .vsix release asset"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR with VSIX artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests?.length) return;
            const issueNumber = pullRequests[0].number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}#artifacts`;
            const body = `[Download VSIX files from this workflow run](${runUrl}) <!-- vsix-pr-comment -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existingId = comments.find(c => c.body.includes('<!-- vsix-pr-comment -->'))?.id;
            if (existingId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingId,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
